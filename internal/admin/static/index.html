<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>agyrelay</title>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<div id="login" hidden>
  <form id="login-form" class="card login-card">
    <h1>agyrelay</h1>
    <label>Admin password<input id="login-password" type="password" autocomplete="current-password" required autofocus></label>
    <button type="submit">Sign in</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</div>
<div id="app" hidden>
  <header>
    <span class="brand">agyrelay</span>
    <nav id="tabs">
      <a href="#accounts">Accounts</a>
      <a href="#calls">Calls</a>
      <a href="#logs">Logs</a>
      <a href="#keys">Keys</a>
      <a href="#settings">Settings</a>
    </nav>
    <button id="logout" class="link">Sign out</button>
  </header>
  <main id="view"></main>
</div>
<div id="toast" role="status"></div>
</body>
</html>
